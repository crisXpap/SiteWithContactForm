<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastry Lab & Catering | ZILVER PÂTISSERIE</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Montserrat:ital,wght@0,300;0,500;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        /* --- Smooth Scroll Setup --- */
        html.lenis, html.lenis body { height: auto; }
        .lenis.lenis-smooth { scroll-behavior: auto !important; }
        .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
        .lenis.lenis-stopped { overflow: hidden; }

        :root {
            --dark-blue: #0072ce;
            --light-blue: #a9c8eb;
            --accent-font: 'Montserrat', sans-serif;
            --body-font: 'Libre Baskerville', serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--light-blue);
            color: var(--dark-blue);
            font-family: var(--body-font);
            line-height: 1.6;
            overflow-x: hidden;
            scrollbar-width: none;
        }
        body::-webkit-scrollbar { display: none; }

        .container { max-width: 1300px; margin: 0 auto; padding: 0 5%; position: relative; }

        /* --- Navigation --- */
        nav {
            padding: 30px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 114, 206, 0.15);
            position: sticky;
            top: 0;
            background-color: var(--light-blue);
            z-index: 2000;
        }

        .nav-logo img { height: 40px; width: auto; }
        
        .nav-right-wrapper { display: flex; align-items: center; gap: 30px; }

        /* --- Mobile Menu --- */
        .menu-icon-btn { display: none; background: none; border: none; color: var(--dark-blue); cursor: pointer; padding: 5px; transition: transform 0.3s ease; align-items: center; }
        .dropdown-menu { position: absolute; top: 100%; left: 0; width: 100%; background-color: var(--light-blue); border-bottom: 1px solid var(--dark-blue); max-height: 0; overflow: hidden; transition: max-height 0.5s cubic-bezier(0.77, 0, 0.175, 1); z-index: 1999; }
        .dropdown-menu.active { max-height: 350px; }
        .dropdown-links { list-style: none; padding: 40px 0; text-align: center; }
        .dropdown-links li { margin: 20px 0; }
        .dropdown-links a { text-decoration: none; color: var(--dark-blue); font-family: var(--accent-font); font-size: 1.1rem; text-transform: uppercase; letter-spacing: 3px; }

        /* --- Back Button Style --- */
        .back-nav { padding: 40px 0 20px; }
        .back-link {
            text-decoration: none;
            color: var(--dark-blue);
            font-family: var(--accent-font);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: opacity 0.5s ease;
        }
        .back-link:hover { opacity: 0.4; }

        /* --- Catalogue Layout --- */
        .catalogue-wrapper {
            display: flex;
            gap: 40px;
            transition: opacity 0.5s ease;
            align-items: flex-start;
            margin-bottom: 100px;
            width: 100%;
            max-width: 100%;
        }

        .menu-page { flex: 1 1 0; min-width: 0; width: 100%; display: flex; flex-direction: column; gap: 15px; }

        .image-container {
            width: 100%;
            box-shadow: 0 15px 45px rgba(0, 114, 206, 0.12);
            border-radius: 4px;
            overflow: hidden;
            background: rgba(255,255,255,0.2);
        }

        .image-container img { width: 100%; height: auto; display: block; }

        .pdf-container {
            width: 100%;
            max-width: 100%;
            aspect-ratio: 1 / 1.414;
            height: auto;
            min-height: 500px;
            box-shadow: 0 15px 45px rgba(0, 114, 206, 0.12);
            border-radius: 4px;
            overflow: hidden;
            background: rgba(255,255,255,0.2);
        }

        .pdf-container embed,
        .pdf-container iframe,
        .pdf-container object { width: 100%; max-width: 100%; height: 100%; min-height: inherit; border: 0; display: block; }

        .photographer-credit {
            font-family: var(--accent-font);
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
            text-align: right;
        }

        .page-title { margin: 20px 0 60px; font-size: clamp(2rem, 5vw, 4rem); font-weight: 400; text-align: left; border-bottom: 1px solid var(--dark-blue); padding-bottom: 20px; }

        /* --- Footer --- */
        footer { border-top: 1px solid var(--dark-blue); padding: 80px 0 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 60px; position: relative; margin-top: 80px; }
        .footer-title { font-family: var(--accent-font); font-size: 0.7rem; margin-bottom: 25px; display: block; letter-spacing: 3px; text-transform: uppercase; font-weight: 500; }
        .footer-content p { font-size: 1rem; margin-bottom: 8px; }
        .hours-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.95rem; }
        .footer-links a { display: block; color: var(--dark-blue); text-decoration: none; margin-bottom: 10px; transition: opacity 0.3s ease; }
        .footer-links a:hover { opacity: 0.6; }
        .signature { grid-column: 1 / -1; text-align: right; font-family: var(--accent-font); font-size: 0.55rem; letter-spacing: 1px; text-transform: uppercase; opacity: 0.4; margin-top: 30px; }

        /* --- Responsive --- */
        @media (max-width: 900px) {
            .catalogue-wrapper { flex-direction: column; gap: 40px; align-items: stretch; }
            .menu-page { flex: none; width: 100%; max-width: 100%; }
            .pdf-container {
                aspect-ratio: 3 / 4;
                min-height: 0;
                height: 75vh;
                max-height: 700px;
            }
            .menu-icon-btn { display: flex; }
            .page-title { margin-bottom: 30px; }
        }

        @media (max-width: 480px) {
            .container { padding: 0 4%; overflow-x: clip; }
            .catalogue-wrapper { gap: 30px; margin-bottom: 60px; }
            .pdf-container {
                aspect-ratio: auto;
                height: 70vh;
                min-height: 420px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo">
            <a href="/"><img src="logo.png" alt="Zilver Logo"></a>  
        </div>

        <div class="nav-right-wrapper">
            <button class="menu-icon-btn" id="menu-btn">
                <span class="material-symbols-outlined" style="font-size: 32px;">menu</span>
            </button>
        </div>

        <div class="dropdown-menu" id="dropdown-menu">
            <ul class="dropdown-links">
                <li><a href="kat.html">Catalogue</a></li>
                <li><a href="catering.html">Catering</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="cake.html">Creations</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="back-nav">
            <a href="/" class="back-link">← Back</a>
        </div>

        <h1 class="page-title">Pastry Lab & Catering</h1>

        <div class="catalogue-wrapper" id="catalogue">
            <div class="menu-page">
                <div class="pdf-container">
                    <embed src="/catering.pdf" type="application/pdf" title="Catering Menu">
                </div>
            </div>

            <div class="menu-page">
                <div class="pdf-container">
                    <embed src="/savory.pdf" type="application/pdf" title="Savory Menu">
                </div>
            </div>
        </div>

        <footer>
            <div class="footer-content">
                <span class="footer-title">Visit Us</span>
                <p>Thrakis 2, Filothei 152 37</p>
                <p style="margin-top: 15px;"><strong>T.</strong> 210 6851918</p>
            </div>
            <div class="footer-content">
                <span class="footer-title">Opening Hours</span>
                <div class="hours-grid">
                    <span>Monday</span> <span>Closed</span>
                    <span>Tue - Fri</span> <span>16:00 – 21:00</span>
                    <span>Sat - Sun</span> <span>10:00 – 14:00 & 17:00 – 21:00</span>
                </div>
            </div>
            <div class="footer-content">
                <span class="footer-title">Follow Us</span>
                <div class="footer-links">
                    <a href="https://www.instagram.com/zilver_patisserie/" target="_blank">Instagram</a>
                    <a href="https://www.facebook.com/p/Zilver-Patisserie-61578572153925/" target="_blank">Facebook</a>
                    <a href="https://www.tiktok.com/@zilver.patisserie" target="_blank">TikTok</a>
                </div>
            </div>
            <div class="signature">engineered by chris pappas</div>
        </footer>
    </div>

    <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
    <script>
        /* --- Smooth Scroll --- */
        const lenis = new Lenis({ duration: 1.2, smoothWheel: true });
        function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
        requestAnimationFrame(raf);

        /* --- Navigation Toggle --- */
        const menuBtn = document.getElementById('menu-btn');
        const dropdown = document.getElementById('dropdown-menu');
        menuBtn.addEventListener('click', () => {
            dropdown.classList.toggle('active');
            menuBtn.style.transform = dropdown.classList.contains('active') ? 'rotate(90deg)' : 'rotate(0deg)';
        });

    </script>
</body>
</html>
